name: CD

# Quote `on:` to prevent YAML 1.1 boolean coercion (`on` keyword → true).
"on":
  push:
    branches: [ main, master ]
    tags: [ 'v*', 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
      action:
        description: "Action"
        required: true
        type: choice
        options:
          - deploy
          - rollback

jobs:
  deploy-staging:
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && inputs.action == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy (staging)
        if: ${{ vars.STAGING_DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_ENV: staging
        run: |
          echo "Starting staging deployment"
          ./scripts/deploy-public-pwa.sh
      - name: Skip (missing config)
        if: ${{ vars.STAGING_DEPLOY_ENABLED != 'true' }}
        run: |
          echo "Staging deploy skipped — set repo variable STAGING_DEPLOY_ENABLED=true to enable."
      - name: Notify
        if: ${{ vars.SLACK_NOTIFY_ENABLED == 'true' }}
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_URL" ]; then
            echo "SLACK_NOTIFY_ENABLED=true but secret SLACK_WEBHOOK_URL is unset — skipping."
            exit 0
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Staging deploy finished: ${{ github.sha }}\"}" \
            "$SLACK_URL"

  deploy-production:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && inputs.action == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy (production)
        if: ${{ vars.PROD_DEPLOY_ENABLED == 'true' }}
        env:
          DEPLOY_ENV: production
        run: |
          echo "Starting production deployment"
          ./scripts/deploy-public-pwa.sh
      - name: Skip (missing config)
        if: ${{ vars.PROD_DEPLOY_ENABLED != 'true' }}
        run: |
          echo "Production deploy skipped — set repo variable PROD_DEPLOY_ENABLED=true to enable."
      - name: Notify
        if: ${{ vars.SLACK_NOTIFY_ENABLED == 'true' }}
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_URL" ]; then
            echo "SLACK_NOTIFY_ENABLED=true but secret SLACK_WEBHOOK_URL is unset — skipping."
            exit 0
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Production deploy finished: ${{ github.sha }}\"}" \
            "$SLACK_URL"

  rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rollback
        if: ${{ vars.ROLLBACK_ENABLED == 'true' }}
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          echo "Rollback requested for $DEPLOY_ENV"
          echo "Implement rollback script and wire it here."
      - name: Skip (missing config)
        if: ${{ vars.ROLLBACK_ENABLED != 'true' }}
        run: |
          echo "Rollback skipped — set repo variable ROLLBACK_ENABLED=true to enable."
      - name: Notify
        if: ${{ vars.SLACK_NOTIFY_ENABLED == 'true' }}
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_URL" ]; then
            echo "SLACK_NOTIFY_ENABLED=true but secret SLACK_WEBHOOK_URL is unset — skipping."
            exit 0
          fi
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Rollback finished for ${{ inputs.environment }}: ${{ github.sha }}\"}" \
            "$SLACK_URL"
