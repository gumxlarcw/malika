name: Checks

# `on:` MUST be quoted — YAML 1.1 treats `on` as boolean `true` keyword,
# which makes GitHub Actions fail to find the workflow trigger.
"on":
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Workflow uses no `${{ github.event.* }}` interpolation in run: blocks —
# all run commands operate on static patterns or env-var inputs only.
# Safe against workflow injection by construction.

jobs:
  # ─── Secret scan (runs first, blocks other jobs if leaks detected) ──────
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded credentials
        run: |
          set -euo pipefail
          # Patterns scoped to known credential formats:
          #   Google API keys, Anthropic OAuth/API tokens, OpenAI proj keys,
          #   GitHub PAT/OAuth/server tokens.
          PATTERNS='AIzaSy[A-Za-z0-9_-]{30,}|sk-ant-oat[A-Za-z0-9_-]{40,}|sk-ant-api[A-Za-z0-9_-]{40,}|sk-proj-[A-Za-z0-9_-]{40,}|gh[ops]_[A-Za-z0-9]{36,}'
          # Scan tracked source only — node_modules / .next / .env are gitignored.
          # Lockfiles excluded (false positives possible from base64-encoded hashes).
          MATCHES=$(git grep -nE "$PATTERNS" -- ':!*.lock' ':!*.lock.json' ':!package-lock.json' || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ HARDCODED CREDENTIALS DETECTED:"
            echo "$MATCHES"
            echo ""
            echo "Move these to .env (which is gitignored) and read from process.env."
            exit 1
          fi
          echo "✓ No hardcoded credentials in tracked source"

      - name: Verify .env files not tracked
        run: |
          set -euo pipefail
          TRACKED_ENV=$(git ls-files | grep -E '^(.*/)?\.env(\.|$)' | grep -v '\.env\.example$' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "❌ .env file(s) committed:"
            echo "$TRACKED_ENV"
            exit 1
          fi
          echo "✓ No .env files tracked"

  # ─── Backend ─────────────────────────────────────────────────────────────
  backend:
    name: Backend
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci --prefer-offline

      - name: Lint
        # backend/eslint.config.js is flat config (ESLint v9): `--ext` no longer
        # exists, so the old fallback could only ever add a confusing second
        # error. The npm script is the single entry point.
        run: npm run lint

      - name: Test
        env:
          DB_NAME: testdb
          DB_USER: testuser
          DB_PASS: testpass
          DB_HOST: localhost
          JWT_SECRET: test-secret
          # backend/.env is gitignored, so the proxy-only guards in
          # utils/requireProxyUrl.js have nothing to read here and would throw at
          # module load, taking whole suites down before a single test runs.
          OPENAI_API_URL: http://127.0.0.1:3031/v1/chat/completions
          OPENAI_API_BASE_URL: http://127.0.0.1:3031/v1
          MALIKA_ANON_SECRET: ci-anon-secret-not-for-production
          # No MariaDB service on this runner: suites that assert on live rows
          # skip instead of failing. Run them locally against the real DB.
          SKIP_DB_TESTS: '1'
        run: |
          if [ -f "./node_modules/.bin/jest" ]; then
            npm test -- --ci --passWithNoTests
          else
            echo "Jest not configured"
          fi

      - name: Audit (high severity only — non-blocking)
        run: npm audit --audit-level=high --omit=dev || true

  # ─── Admin (Next.js) ─────────────────────────────────────────────────────
  admin:
    name: Admin Panel
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/admin/package-lock.json
      - name: Install deps
        run: npm ci --prefer-offline
      - name: TypeScript check
        run: npx tsc --noEmit || echo "TypeScript check skipped"
      - name: Build
        run: npm run build --if-present || echo "Build skipped"
      - name: Audit (high severity only — non-blocking)
        run: npm audit --audit-level=high --omit=dev || true

  # ─── Frontend (PWA Next.js) ──────────────────────────────────────────────
  frontend:
    name: Frontend (PWA)
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci --prefer-offline --legacy-peer-deps
      - name: TypeScript check
        run: npx tsc --noEmit || echo "TypeScript check skipped"
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: npm run build --if-present || echo "Build skipped"
      - name: Audit (high severity only — non-blocking)
        run: npm audit --audit-level=high --omit=dev || true
