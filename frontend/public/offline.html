<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MALIKA • Offline</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f9fafb; color: #111827; margin: 0; padding: 40px; }
      .card { max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08); }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 12px; color: #6b7280; }
      .hint { font-size: 13px; color: #9ca3af; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Anda sedang offline</h1>
      <p>Koneksi internet tidak tersedia. Beberapa halaman masih bisa diakses dari cache.</p>
      <p class="hint">Coba lagi saat koneksi kembali.</p>
    </div>
  </body>
</html>
